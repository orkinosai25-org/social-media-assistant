version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: src/SocialMediaAssistant.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=socialassistant;Username=postgres;******
      - Redis__ConnectionString=redis:6379
    depends_on:
      - db
      - redis

  web:
    build:
      context: .
      dockerfile: src/SocialMediaAssistant.Web/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=socialassistant;Username=postgres;******
      - Redis__ConnectionString=redis:6379
    depends_on:
      - db
      - redis
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialassistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
