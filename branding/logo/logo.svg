<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">SocialMediaAssistant</title>
  <desc id="logo-desc">SocialMediaAssistant logo: gradient speech-bubble icon with stacked wordmark</desc>
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#E1306C"/>
    </linearGradient>
  </defs>

  <!-- Icon: overlapping speech bubbles forming AI spark / S shape -->
  <!-- Main bubble -->
  <rect x="4" y="6" width="38" height="26" rx="8" ry="8" fill="url(#grad-icon)" opacity="0.95"/>
  <!-- Tail -->
  <polygon points="12,32 8,42 22,32" fill="url(#grad-icon)" opacity="0.85"/>
  <!-- Second bubble (offset, smaller) -->
  <rect x="18" y="20" width="28" height="20" rx="6" ry="6" fill="#1877F2" opacity="0.85"/>
  <!-- Tail second bubble -->
  <polygon points="36,40 40,48 28,40" fill="#1877F2" opacity="0.75"/>
  <!-- Spark dot 1 -->
  <circle cx="48" cy="10" r="3" fill="#25D366" opacity="0.9"/>
  <!-- Spark dot 2 -->
  <circle cx="55" cy="5" r="2" fill="#FCAF45" opacity="0.85"/>
  <!-- Spark dot 3 -->
  <circle cx="53" cy="14" r="1.5" fill="#E1306C" opacity="0.8"/>

  <!-- Wordmark -->
  <text x="68" y="28" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="11" font-weight="700" letter-spacing="-0.2"
        fill="url(#grad-text)">Social Media</text>
  <text x="68" y="43" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="14" font-weight="800" letter-spacing="-0.3"
        fill="url(#grad-text)">Assistant</text>
</svg>
