<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">SocialMediaAssistant Icon</title>
  <desc id="icon-desc">SocialMediaAssistant speech-bubble AI spark icon</desc>
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>
  </defs>

  <!-- Main speech bubble -->
  <rect x="3" y="4" width="38" height="28" rx="9" ry="9" fill="url(#grad-icon)" opacity="0.95"/>
  <!-- Tail -->
  <polygon points="8,32 4,44 20,32" fill="url(#grad-icon)" opacity="0.9"/>
  <!-- Secondary bubble -->
  <rect x="20" y="22" width="28" height="20" rx="7" ry="7" fill="#1877F2" opacity="0.88"/>
  <!-- Tail 2 -->
  <polygon points="36,42 40,52 28,42" fill="#1877F2" opacity="0.78"/>
  <!-- Spark dots -->
  <circle cx="50" cy="8"  r="4"   fill="#25D366" opacity="0.92"/>
  <circle cx="57" cy="3"  r="2.5" fill="#FCAF45" opacity="0.88"/>
  <circle cx="55" cy="16" r="2"   fill="#E1306C" opacity="0.82"/>
</svg>
