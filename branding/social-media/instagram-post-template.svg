<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="ig-post-title ig-post-desc">
  <title id="ig-post-title">SocialMediaAssistant Instagram Post Template</title>
  <desc id="ig-post-desc">SocialMediaAssistant branded Instagram square post template (1080×1080)</desc>
  <defs>
    <linearGradient id="ig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D0D1A"/>
      <stop offset="60%"  stop-color="#1A0533"/>
      <stop offset="100%" stop-color="#0A0A22"/>
    </linearGradient>
    <linearGradient id="ig-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
    <linearGradient id="ig-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#E1306C"/>
    </linearGradient>
    <linearGradient id="ig-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="ig-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#25D366"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <linearGradient id="ig-logo-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>
    <filter id="ig-glow">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#ig-bg)"/>

  <!-- Glow orbs -->
  <circle cx="900" cy="200" r="340" fill="#833AB4" opacity="0.08" filter="url(#ig-glow)"/>
  <circle cx="180" cy="860" r="240" fill="#1877F2" opacity="0.07" filter="url(#ig-glow)"/>

  <!-- Decorative chat bubbles — background -->
  <!-- Large bubble top-right -->
  <rect x="750" y="80"  width="260" height="180" rx="52" fill="url(#ig-primary)" opacity="0.18"/>
  <polygon points="770,260 755,308 815,260" fill="url(#ig-primary)" opacity="0.18"/>
  <!-- Medium bubble mid-right -->
  <rect x="880" y="380" width="180" height="126" rx="40" fill="#1877F2" opacity="0.16"/>
  <polygon points="1020,506 1032,546 992,506" fill="#1877F2" opacity="0.16"/>
  <!-- Small bubble bottom-left -->
  <rect x="60"  y="780" width="150" height="104" rx="36" fill="url(#ig-green)" opacity="0.16"/>
  <polygon points="80,884 68,920 115,884" fill="url(#ig-green)" opacity="0.16"/>
  <!-- Tiny accent bubble top-left -->
  <rect x="60"  y="160" width="100" height="70"  rx="24" fill="#F77737" opacity="0.18"/>
  <polygon points="75,230 65,262 100,230" fill="#F77737" opacity="0.18"/>

  <!-- Spark dots -->
  <circle cx="700" cy="70"  r="12" fill="#25D366" opacity="0.65"/>
  <circle cx="760" cy="40"  r="8"  fill="#FCAF45" opacity="0.6"/>
  <circle cx="1020" cy="300" r="9" fill="#E1306C" opacity="0.5"/>
  <circle cx="1050" cy="560" r="12" fill="#833AB4" opacity="0.45"/>
  <circle cx="60"  cy="540" r="8"  fill="#1877F2" opacity="0.5"/>

  <!-- ── NEW FEATURE badge (top area) ─────────────────────── -->
  <rect x="80" y="80" width="240" height="52" rx="26" fill="url(#ig-badge)"/>
  <text x="200" y="112" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="1.5">✦ NEW FEATURE</text>

  <!-- ── Headline placeholder ──────────────────────────────── -->
  <!-- Grey placeholder box for headline text -->
  <rect x="80" y="420" width="900" height="100" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="530" y="468" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="28" font-weight="700" fill="rgba(255,255,255,0.35)" text-anchor="middle">
    YOUR HEADLINE HERE
  </text>
  <text x="530" y="498" font-family="'Inter',sans-serif" font-size="18" font-weight="400"
        fill="rgba(255,255,255,0.25)" text-anchor="middle">
    Supporting subtext goes here
  </text>

  <!-- ── Body text placeholder ─────────────────────────────── -->
  <rect x="80" y="560" width="900" height="200" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="530" y="660" font-family="'Inter',sans-serif" font-size="20"
        fill="rgba(255,255,255,0.2)" text-anchor="middle">Body copy / feature description</text>

  <!-- ── Gradient divider line ─────────────────────────────── -->
  <rect x="80" y="800" width="900" height="3" rx="2" fill="url(#ig-primary)" opacity="0.6"/>

  <!-- ── CTA area ───────────────────────────────────────────── -->
  <text x="80" y="845" font-family="'Inter',sans-serif" font-size="20" fill="#B0B0CC">
    🌐 socialmediaassistant.ai  •  ✦ AI-powered  •  24/7 availability
  </text>

  <!-- ── SocialMediaAssistant logo — bottom-right ─────────────────────────── -->
  <g transform="translate(820, 920)">
    <rect x="0" y="0" width="52" height="36" rx="10" fill="url(#ig-logo-g)" opacity="0.96"/>
    <polygon points="8,36 3,54 24,36" fill="url(#ig-logo-g)" opacity="0.86"/>
    <rect x="22" y="22" width="38" height="27" rx="8" fill="#1877F2" opacity="0.88"/>
    <polygon points="44,49 50,65 32,49" fill="#1877F2" opacity="0.78"/>
    <circle cx="68" cy="8"  r="5"   fill="#25D366" opacity="0.92"/>
    <circle cx="78" cy="1"  r="3.5" fill="#FCAF45" opacity="0.88"/>
    <circle cx="76" cy="18" r="2.5" fill="#E1306C" opacity="0.82"/>
    <text x="92" y="30" font-family="'Plus Jakarta Sans','Inter',sans-serif"
          font-size="13" font-weight="700" letter-spacing="-0.2" fill="#FFFFFF">Social Media</text>
    <text x="92" y="46" font-family="'Plus Jakarta Sans','Inter',sans-serif"
          font-size="17" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">Assistant</text>
  </g>
</svg>
