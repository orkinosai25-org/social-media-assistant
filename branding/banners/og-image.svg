<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">SocialMediaAssistant — Your AI. Always Selling.</title>
  <desc id="og-desc">SocialMediaAssistant Open Graph image for website link previews</desc>
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#1A0533"/>
    </linearGradient>
    <linearGradient id="og-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
    <linearGradient id="og-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="og-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#25D366"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <linearGradient id="og-logo-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>
    <filter id="og-glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Glow orbs -->
  <circle cx="1050" cy="80"  r="200" fill="#833AB4" opacity="0.09" filter="url(#og-glow)"/>
  <circle cx="200"  cy="500" r="140" fill="#1877F2" opacity="0.08" filter="url(#og-glow)"/>

  <!-- Decorative bubbles right -->
  <rect x="840" y="60"  width="160" height="110" rx="36" fill="url(#og-primary)" opacity="0.28"/>
  <polygon points="855,170 845,198 880,170" fill="url(#og-primary)" opacity="0.28"/>
  <rect x="1000" y="200" width="120" height="84"  rx="28" fill="url(#og-blue)"    opacity="0.32"/>
  <polygon points="1082,284 1092,310 1062,284" fill="url(#og-blue)" opacity="0.32"/>
  <rect x="920"  y="380" width="100" height="68"  rx="24" fill="url(#og-green)"   opacity="0.28"/>
  <polygon points="940,448 930,474 962,448" fill="url(#og-green)" opacity="0.28"/>

  <!-- Spark dots -->
  <circle cx="790" cy="46"  r="7" fill="#25D366" opacity="0.65"/>
  <circle cx="832" cy="24"  r="4" fill="#FCAF45" opacity="0.6"/>
  <circle cx="1140" cy="140" r="6" fill="#E1306C" opacity="0.55"/>
  <circle cx="1160" cy="320" r="8" fill="#833AB4" opacity="0.5"/>

  <!-- Logo top-left -->
  <g transform="translate(60, 44)">
    <rect x="0" y="0" width="44" height="30" rx="9" fill="url(#og-logo-g)" opacity="0.96"/>
    <polygon points="6,30 2,44 18,30" fill="url(#og-logo-g)" opacity="0.86"/>
    <rect x="17" y="17" width="31" height="22" rx="7" fill="#1877F2" opacity="0.88"/>
    <polygon points="34,39 38,52 25,39" fill="#1877F2" opacity="0.78"/>
    <circle cx="56" cy="6"  r="4"   fill="#25D366" opacity="0.92"/>
    <circle cx="64" cy="1"  r="2.5" fill="#FCAF45" opacity="0.88"/>
    <circle cx="62" cy="15" r="2"   fill="#E1306C" opacity="0.82"/>
    <text x="74" y="23" font-family="'Plus Jakarta Sans','Inter',sans-serif"
          font-size="11" font-weight="700" letter-spacing="-0.2" fill="#FFFFFF">Social Media</text>
    <text x="74" y="37" font-family="'Plus Jakarta Sans','Inter',sans-serif"
          font-size="14" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">Assistant</text>
  </g>

  <!-- Tagline badge -->
  <rect x="60" y="140" width="320" height="36" rx="18" fill="url(#og-primary)" opacity="0.8"/>
  <text x="220" y="163" font-family="'Inter',sans-serif" font-size="15" font-weight="600"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AI SOCIAL MEDIA ASSISTANT</text>

  <!-- Main headline -->
  <text x="60" y="265" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="88" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Your AI.</text>
  <text x="60" y="365" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="88" font-weight="800" letter-spacing="-2">
    <tspan fill="#833AB4">Always </tspan><tspan fill="#E1306C">Selling.</tspan>
  </text>

  <!-- Sub-headline -->
  <text x="60" y="420" font-family="'Inter',sans-serif" font-size="22" font-weight="400"
        fill="#B0B0CC">Automate Instagram, WhatsApp &amp; Facebook — 24/7</text>

  <!-- Platform pills -->
  <rect x="60"  y="458" width="130" height="34" rx="17" fill="url(#og-primary)" opacity="0.82"/>
  <text x="125" y="480" font-family="'Inter',sans-serif" font-size="13" font-weight="600"
        fill="#fff" text-anchor="middle">📷 Instagram</text>

  <rect x="202" y="458" width="130" height="34" rx="17" fill="url(#og-green)" opacity="0.82"/>
  <text x="267" y="480" font-family="'Inter',sans-serif" font-size="13" font-weight="600"
        fill="#fff" text-anchor="middle">💬 WhatsApp</text>

  <rect x="344" y="458" width="130" height="34" rx="17" fill="url(#og-blue)" opacity="0.82"/>
  <text x="409" y="480" font-family="'Inter',sans-serif" font-size="13" font-weight="600"
        fill="#fff" text-anchor="middle">👍 Facebook</text>

  <!-- Bottom domain -->
  <text x="60" y="590" font-family="'Inter',sans-serif" font-size="16" fill="#6B6B8A">socialmediaassistant.ai</text>
  <!-- Divider line -->
  <line x1="60" y1="560" x2="560" y2="560" stroke="#333355" stroke-width="1"/>
</svg>
