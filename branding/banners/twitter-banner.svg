<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-labelledby="twitter-title twitter-desc">
  <title id="twitter-title">SMTX — AI Social Media Assistant</title>
  <desc id="twitter-desc">SMTX Twitter/X profile banner</desc>
  <defs>
    <linearGradient id="bg-tw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D0D1A"/>
      <stop offset="60%"  stop-color="#1A0533"/>
      <stop offset="100%" stop-color="#0A0A22"/>
    </linearGradient>
    <linearGradient id="tw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
    <linearGradient id="tw-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="tw-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#25D366"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <filter id="tw-glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tw-logo-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg-tw)"/>

  <!-- Decorative glow orbs -->
  <circle cx="1300" cy="100" r="240" fill="#833AB4" opacity="0.07" filter="url(#tw-glow)"/>
  <circle cx="200"  cy="380" r="160" fill="#1877F2" opacity="0.06" filter="url(#tw-glow)"/>
  <circle cx="750"  cy="250" r="200" fill="#E1306C" opacity="0.04" filter="url(#tw-glow)"/>

  <!-- Decorative bubbles right side -->
  <rect x="1150" y="40"  width="180" height="120" rx="40" fill="url(#tw-grad)"  opacity="0.25"/>
  <polygon points="1165,160 1155,190 1195,160" fill="url(#tw-grad)" opacity="0.25"/>
  <rect x="1310" y="180" width="130" height="90"  rx="30" fill="url(#tw-blue)"  opacity="0.3"/>
  <polygon points="1395,270 1405,298 1375,270" fill="url(#tw-blue)" opacity="0.3"/>
  <rect x="1100" y="320" width="110" height="76"  rx="26" fill="url(#tw-green)" opacity="0.28"/>
  <polygon points="1120,396 1112,424 1145,396" fill="url(#tw-green)" opacity="0.28"/>

  <!-- Spark dots -->
  <circle cx="1050" cy="50"  r="7" fill="#25D366" opacity="0.65"/>
  <circle cx="1090" cy="30"  r="4" fill="#FCAF45" opacity="0.6"/>
  <circle cx="1420" cy="100" r="5" fill="#E1306C" opacity="0.55"/>
  <circle cx="1460" cy="280" r="8" fill="#833AB4" opacity="0.5"/>
  <circle cx="900"  cy="440" r="6" fill="#1877F2" opacity="0.5"/>

  <!-- Logo top-left -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="46" height="32" rx="10" fill="url(#tw-logo-g)" opacity="0.96"/>
    <polygon points="7,32 3,46 20,32" fill="url(#tw-logo-g)" opacity="0.86"/>
    <rect x="18" y="18" width="32" height="24" rx="8" fill="#1877F2" opacity="0.88"/>
    <polygon points="36,42 40,56 26,42" fill="#1877F2" opacity="0.78"/>
    <circle cx="58" cy="7"  r="4.5" fill="#25D366" opacity="0.92"/>
    <circle cx="66" cy="1"  r="3"   fill="#FCAF45" opacity="0.88"/>
    <circle cx="64" cy="16" r="2.2" fill="#E1306C" opacity="0.82"/>
    <text x="78" y="36" font-family="'Plus Jakarta Sans','Inter',sans-serif"
          font-size="34" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">SMTX</text>
  </g>

  <!-- Main headline -->
  <text x="60" y="230" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="72" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">
    SMTX — AI Social Media Assistant
  </text>

  <!-- Sub-headline -->
  <text x="60" y="295" font-family="'Inter',sans-serif" font-size="28" font-weight="400"
        fill="#B0B0CC" letter-spacing="0.1">
    Automate every DM. Close every sale. 24/7.
  </text>

  <!-- Tagline gradient -->
  <text x="60" y="360" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#833AB4">"Your AI. </tspan><tspan fill="#E1306C">Always Selling."</tspan>
  </text>

  <!-- Platform tags -->
  <rect x="60"  y="400" width="140" height="38" rx="19" fill="url(#tw-grad)"  opacity="0.85"/>
  <text x="130" y="424" font-family="'Inter',sans-serif" font-size="15" font-weight="600"
        fill="#fff" text-anchor="middle">Instagram</text>

  <rect x="214" y="400" width="140" height="38" rx="19" fill="url(#tw-green)" opacity="0.85"/>
  <text x="284" y="424" font-family="'Inter',sans-serif" font-size="15" font-weight="600"
        fill="#fff" text-anchor="middle">WhatsApp</text>

  <rect x="368" y="400" width="140" height="38" rx="19" fill="url(#tw-blue)"  opacity="0.85"/>
  <text x="438" y="424" font-family="'Inter',sans-serif" font-size="15" font-weight="600"
        fill="#fff" text-anchor="middle">Facebook</text>
</svg>
