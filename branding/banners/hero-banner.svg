<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">SocialMediaAssistant — Your AI. Always Selling.</title>
  <desc id="hero-desc">SocialMediaAssistant hero banner: AI Social Media Assistant for Instagram, WhatsApp and Facebook</desc>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#1A0533"/>
    </linearGradient>
    <!-- Primary icon gradient -->
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="40%"  stop-color="#E1306C"/>
      <stop offset="80%"  stop-color="#F77737"/>
      <stop offset="100%" stop-color="#FCAF45"/>
    </linearGradient>
    <!-- Blue gradient -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
    <!-- Green gradient -->
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#25D366"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Logo icon gradient reuse -->
    <linearGradient id="logo-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#833AB4"/>
      <stop offset="50%"  stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#1877F2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- ── Decorative bubble shapes (background layer) ─────── -->
  <!-- Large bubble top-right -->
  <rect x="820" y="-40" width="280" height="200" rx="60" fill="url(#hero-grad)" opacity="0.12" filter="url(#glow-soft)"/>
  <!-- Medium bubble mid-right -->
  <rect x="960" y="200" width="200" height="140" rx="50" fill="#1877F2" opacity="0.10" filter="url(#glow-soft)"/>
  <!-- Small bubble bottom-left -->
  <rect x="-30" y="420" width="160" height="120" rx="45" fill="url(#hero-grad)" opacity="0.10" filter="url(#glow-soft)"/>
  <!-- Extra glow orb -->
  <circle cx="950" cy="120" r="180" fill="#833AB4" opacity="0.07" filter="url(#glow-soft)"/>
  <circle cx="250" cy="480" r="120" fill="#1877F2" opacity="0.07" filter="url(#glow-soft)"/>

  <!-- ── Decorative speech bubbles (mid layer) ────────────── -->
  <!-- Bubble 1 — purple/pink, top-right area -->
  <rect x="870" y="60" width="120" height="80" rx="22" fill="url(#hero-grad)" opacity="0.35"/>
  <polygon points="890,140 880,168 910,140" fill="url(#hero-grad)" opacity="0.35"/>
  <!-- Bubble 2 — blue, right -->
  <rect x="1020" y="180" width="90" height="60" rx="18" fill="url(#blue-grad)" opacity="0.4"/>
  <polygon points="1090,240 1098,262 1072,240" fill="url(#blue-grad)" opacity="0.4"/>
  <!-- Bubble 3 — green, bottom-right -->
  <rect x="940" y="380" width="100" height="68" rx="20" fill="url(#green-grad)" opacity="0.38"/>
  <polygon points="960,448 952,472 982,448" fill="url(#green-grad)" opacity="0.38"/>
  <!-- Bubble 4 — small orange, upper-mid -->
  <rect x="700" y="30" width="60" height="42" rx="12" fill="#F77737" opacity="0.3"/>
  <polygon points="714,72 708,90 730,72" fill="#F77737" opacity="0.3"/>
  <!-- Floating dots / sparks -->
  <circle cx="800" cy="50"  r="8"  fill="#25D366" opacity="0.6"/>
  <circle cx="840" cy="30"  r="5"  fill="#FCAF45" opacity="0.6"/>
  <circle cx="1110" cy="150" r="6" fill="#E1306C" opacity="0.5"/>
  <circle cx="1140" cy="340" r="9" fill="#833AB4" opacity="0.5"/>
  <circle cx="780" cy="550" r="7"  fill="#1877F2" opacity="0.5"/>

  <!-- ── Logo top-left ─────────────────────────────────────── -->
  <g transform="translate(52, 44)">
    <!-- Icon -->
    <rect x="0" y="0" width="42" height="30" rx="9" fill="url(#logo-g)" opacity="0.96"/>
    <polygon points="6,30 2,44 18,30" fill="url(#logo-g)" opacity="0.86"/>
    <rect x="16" y="16" width="30" height="22" rx="7" fill="#1877F2" opacity="0.88"/>
    <polygon points="32,38 36,50 24,38" fill="#1877F2" opacity="0.78"/>
    <circle cx="54" cy="6"  r="4"   fill="#25D366" opacity="0.92"/>
    <circle cx="62" cy="1"  r="2.5" fill="#FCAF45" opacity="0.88"/>
    <circle cx="60" cy="14" r="2"   fill="#E1306C" opacity="0.82"/>
    <!-- Wordmark -->
    <text x="72" y="24" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
          font-size="11" font-weight="700" letter-spacing="-0.2" fill="#FFFFFF">Social Media</text>
    <text x="72" y="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
          font-size="14" font-weight="800" letter-spacing="-0.3" fill="#FFFFFF">Assistant</text>
  </g>

  <!-- ── Main headline ─────────────────────────────────────── -->
  <text x="80" y="280" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="80" font-weight="800" letter-spacing="-2" fill="#FFFFFF" filter="url(#glow)">
    Your AI.
  </text>
  <text x="80" y="375" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="80" font-weight="800" letter-spacing="-2">
    <tspan fill="#833AB4">Always </tspan><tspan fill="#E1306C">Selling.</tspan>
  </text>

  <!-- ── Sub-headline ──────────────────────────────────────── -->
  <text x="80" y="430" font-family="'Inter', sans-serif"
        font-size="24" font-weight="400" fill="#B0B0CC" letter-spacing="0.2">
    Automate Instagram, WhatsApp &amp; Facebook messages 24/7
  </text>

  <!-- ── CTA pill ───────────────────────────────────────────── -->
  <rect x="80" y="460" width="220" height="52" rx="26" fill="url(#hero-grad)"/>
  <text x="190" y="492" font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Start Free Trial →
  </text>

  <!-- ── Platform strip at bottom ─────────────────────────── -->
  <rect x="0" y="568" width="1200" height="62" fill="rgba(255,255,255,0.04)"/>

  <!-- Instagram icon (simplified) -->
  <g transform="translate(370, 578)">
    <rect width="42" height="42" rx="10" fill="url(#hero-grad)" opacity="0.9"/>
    <rect x="11" y="11" width="20" height="20" rx="5" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="21" cy="21" r="5.5" fill="none" stroke="#fff" stroke-width="2.2"/>
    <circle cx="31.5" cy="10.5" r="2" fill="#fff"/>
  </g>
  <text x="422" y="606" font-family="'Inter', sans-serif" font-size="13" fill="#B0B0CC" font-weight="500">Instagram</text>

  <!-- WhatsApp icon (simplified) -->
  <g transform="translate(530, 578)">
    <rect width="42" height="42" rx="21" fill="url(#green-grad)" opacity="0.9"/>
    <path d="M21 10 C14.4 10 9 15.4 9 22 C9 24.3 9.7 26.4 10.9 28.2 L9.2 34 L15.2 32.3 C16.9 33.3 18.9 34 21 34 C27.6 34 33 28.6 33 22 C33 15.4 27.6 10 21 10Z"
          fill="#fff" opacity="0.95"/>
    <path d="M15 18.5 C15.5 17.5 16.5 17 17.5 17.2 L18.8 17.5 L19.8 20.2 L18.8 21.5 C18.5 21.9 18.5 22.5 18.8 23 C19.5 24.2 20.5 25.2 21.7 25.9 C22.2 26.2 22.8 26.1 23.2 25.7 L24.5 24.7 L27 25.7 L27.5 27 C27.8 28 27.2 29.1 26.2 29.5 C23 30.8 17.8 28.5 15 22.5 C14.6 21.5 14.5 19.5 15 18.5Z"
          fill="url(#green-grad)" opacity="0.9"/>
  </g>
  <text x="582" y="606" font-family="'Inter', sans-serif" font-size="13" fill="#B0B0CC" font-weight="500">WhatsApp</text>

  <!-- Facebook icon (simplified) -->
  <g transform="translate(690, 578)">
    <rect width="42" height="42" rx="10" fill="url(#blue-grad)" opacity="0.9"/>
    <text x="13" y="30" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#fff">f</text>
  </g>
  <text x="742" y="606" font-family="'Inter', sans-serif" font-size="13" fill="#B0B0CC" font-weight="500">Facebook</text>

  <!-- socialmediaassistant.ai label bottom right -->
  <text x="1140" y="606" font-family="'Inter', sans-serif" font-size="13" fill="#6B6B8A"
        text-anchor="end">socialmediaassistant.ai</text>
</svg>
